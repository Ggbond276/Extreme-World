syntax = "proto3";

package SkillBridge.Message;

option csharp_namespace = "SkillBridge.Message";
option cc_enable_arenas = true;

////////////////////////////////////////////////////////////////
//
//  Basic Defines
//
////////////////////////////////////////////////////////////////
enum RESULT
{
	SUCCESS = 0;
	FAILED = 1;
}

enum CHARACTER_TYPE
{
	Player = 0;
	NPC = 1;
	Monster = 2;
}

enum CHARACTER_CLASS
{
	NONE = 0;
	WARRIOR = 1;
	WIZARD = 2;
	ARCHER = 3;
}

enum CHARACTER_STATE
{
	IDLE = 0;
	MOVE = 1;
}

enum ENTITY_EVENT
{
	NONE = 0;
	IDLE = 1;
	MOVE_FWD = 2;
	MOVE_BACK = 3;
	JUMP = 4;
}

enum ITEM_TYPE
{
	NORMAL = 0;
	MATERIAL = 1;
	TASK = 2;
	EQUIP = 3;
}

enum EQUIP_SLOT
{
    WEAPON    = 0; //武器
    ACCESSORY = 1; //配件
    HELMET    = 2; //头盔
    CHEST     = 3; //胸甲
    SHOULDER  = 4; //护肩
    PANTS     = 5; //裤子
    BOOTS     = 6; //靴子
    SLOT_MAX  = 7;
}

////////////////////////////////////////////////////////////////
//
//  NInfo
//
////////////////////////////////////////////////////////////////

message NUserInfo {
	int32 id = 1;
	NPlayerInfo player = 2;
}

message NPlayerInfo {
	int32 id = 1;
	repeated NCharacterInfo characters = 2;
}

message NCharacterInfo {
	int32 id = 1; // db_id
	int32 config_id = 2; // config_id;
	int32 entity_id = 3; // entity_id;
	string name = 4;
	CHARACTER_TYPE type = 5;
	CHARACTER_CLASS class = 6;
	int32 level = 7;
	int32 mapId = 8;
	NEntity entity = 9;
	int64 gold = 10;
	repeated NItemInfo Items = 11;
	NBagInfo Bag = 12;
	bytes Equips = 13;
	repeated NQuestInfo quests = 14;
	int64 exp = 15;
	repeated NFriendInfo friends = 16;
	NGuildInfo guild = 17;
}

message NItemInfo
{
	int32 id = 1;
	int32 count = 2;
}

message NVector3
{
	int32 x = 1;
	int32 y = 2;
	int32 z = 3;
}

message NBagInfo
{
	int32 Unlocked = 1;
	bytes Items = 2;
}


////////////////////////////////////////////////////////////////
//
//  Status
//
////////////////////////////////////////////////////////////////

enum STATUS_ACTION
{
	UPDATE = 0;
	ADD = 1;
	DELETE = 2;
}

enum STATUS_TYPE
{
	MONEY = 0;
	EXP = 1;
	SKILL_POINT = 2;
	ITEM = 3;
}

enum STATUS_SOURCE
{
	UPDATE = 0;
	ADD = 1;
	DELETE = 2;
}

message NStatus
{
	STATUS_TYPE type = 1;
	STATUS_ACTION action = 2;
	int32 id = 3;
	int32 value = 4;
}

message StatusNotify
{
	repeated NStatus Status = 1;
}

////////////////////////////////////////////////////////////////
//
//  Entities
//
////////////////////////////////////////////////////////////////


message NEntity {
	int32 id = 1;
	NVector3 position = 2;
	NVector3 direction = 3;
	int32 speed = 4;
}

message NEntitySync {
	int32 id = 1;
	ENTITY_EVENT event = 2;
	NEntity entity = 3;
}



////////////////////////////////////////////////////////////////
//
//  Messages
//
////////////////////////////////////////////////////////////////

message NetMessage{
	NetMessageRequest Request = 1;
	NetMessageResponse Response = 2;
}

message NetMessageRequest{
	UserRegisterRequest userRegister = 1;
	UserLoginRequest userLogin = 2;
	UserCreateCharacterRequest createChar = 3;
	UserGameEnterRequest gameEnter = 4;
	UserGameLeaveRequest gameLeave = 5;
	
	MapCharacterEnterRequest mapCharacterEnter = 6;

	MapEntitySyncRequest mapEntitySync = 8;
	MapTeleportRequest mapTeleport = 9;

	ItemBuyRequest itemBuy = 10;
    ItemEquipRequest itemEquip = 11;

	QuestListRequest questList = 12;
	QuestAcceptRequest questAccept = 13;
	QuestSubmitRequest questSubmit = 14;
	QuestAbandonRequest questAbandon = 15;

	FriendAddRequest friendAdd = 16;
	FriendListRequest friendList = 17;
	FriendRemoveRequest friendRemove = 18;

	TeamInviteRequest teamInviteReq = 19;
	TeamInviteResponse teamInviteRes = 20;
	TeamInfoRequest teamInfo = 21;
	TeamLeaveRequest teamLeave = 22;

    // ---------------- 公会系统 (Guild) ----------------
    GuildCreateRequest guildCreate = 23;
    GuildDisbandRequest guildDisband = 24;
    GuildSettingModifyRequest guildSettingModify = 25;
    GuildJoinApplyRequest guildJoinApply = 26;
    GuildApplyProcessRequest guildApplyProcess = 27;
    GuildLeaveRequest guildLeave = 28;
    GuildChatRequest guildChat = 29;
    GuildMemberListRequest guildMemberList = 30;
    GuildApplyListRequest guildApplyList = 31;
    GuildListRequest guildList = 32;
    GuildAdminRequest guildAdmin = 33;

    // ---------------- 聊天系统 (Guild) ----------------
	ChatRequest chatRequest = 40;
}

message NetMessageResponse{
	UserRegisterResponse userRegister = 1;
	UserLoginResponse userLogin = 2;
	UserCreateCharacterResponse createChar = 3;
	UserGameEnterResponse gameEnter = 4;
	UserGameLeaveResponse gameLeave = 5;

	MapCharacterEnterResponse mapCharacterEnter = 6;
	MapCharacterLeaveResponse mapCharacterLeave = 7;

	MapEntitySyncResponse mapEntitySync = 8;

	ItemBuyResponse itemBuy = 10;
	ItemEquipReponse itemEquip = 11;

	QuestListResponse questList = 12;
	QuestAcceptResponse questAccept = 13;
	QuestSubmitResponse questSubmit = 14;
	QuestAbandonResponse questAbandon = 15;

    FriendAddResponse friendAdd = 16;
	FriendListResponse friendList = 17;
	FriendRemoveResponse friendRemove = 18;

	TeamInviteRequest teamInviteReq = 19;
	TeamInviteResponse teamInviteRes = 20;
	TeamInfoResponse teamInfo = 21;
	TeamLeaveResponse teamLeave = 22;

    // ---------------- 公会系统操作响应 (Response) ----------------
    GuildCreateResponse guildCreate = 23;
    GuildDisbandResponse guildDisband = 24;
    GuildSettingModifyResponse guildSettingModify = 25;
    GuildJoinApplyResponse guildJoinApply = 26;
    GuildApplyProcessResponse guildApplyProcess = 27;
    GuildLeaveResponse guildLeave = 28;
    // 29 留空给 Chat 的对称位置 
    GuildMemberListResponse guildMemberList = 30;
    GuildApplyListResponse guildApplyList = 31;
    GuildListResponse guildList = 32;
    GuildAdminResponse guildAdmin = 33;

	// ---------------- 公会系统全局推送 (Notify) ----------------
    GuildMemberAddNotify guildMemberAddNotify = 34;
    GuildMemberRemoveNotify guildMemberRemoveNotify = 35;
    GuildApplyAddNotify guildApplyAddNotify = 36;
    GuildApplyRemoveNotify guildApplyRemoveNotify = 37;
    GuildApplyResultNotify guildApplyResultNotify = 38;
    GuildInfoChangeNotify guildInfoChangeNotify = 39;
    GuildChatNotify guildChatNotify = 40;


    // ---------------- 聊天系统操作响应 (Response) ----------------
    ChatResponse chatResponse = 41;

	// ---------------- 聊天系统全局推送 (Notify) ----------------
	ChatNotify chatNotify = 42;


	StatusNotify statusNotify = 100;
}

////////////////////////////////////////////////////////////////
//
//  Messages
//
////////////////////////////////////////////////////////////////
// User Protocol
message UserLoginRequest {
	string user = 1;
	string passward = 2;
}

message UserLoginResponse {
	RESULT result = 1;
	string errormsg = 2;
	NUserInfo userinfo = 3;
}


message UserRegisterRequest
{
	string user = 1;
	string passward = 2;
}

message UserRegisterResponse {
	RESULT result = 1;
	string errormsg = 2;
}

message UserCreateCharacterRequest
{
	string name = 1;
	CHARACTER_CLASS class = 2;
}

message UserCreateCharacterResponse {
	RESULT result = 1;
	string errormsg = 2;
	repeated NCharacterInfo characters = 3;
}

message UserGameEnterRequest
{
	int32 characterIdx = 1;
}

message UserGameEnterResponse {
	RESULT result = 1;
	string errormsg = 2;
	NCharacterInfo character = 3;
}

message UserGameLeaveRequest
{
}

message UserGameLeaveResponse {
	RESULT result = 1;
	string errormsg = 2;
}

// Map Protocol
message MapCharacterEnterRequest
{
	int32 mapId = 1;
}

message MapCharacterEnterResponse
{
	int32 mapId = 1;
	repeated NCharacterInfo characters = 2;
}

message MapCharacterLeaveResponse
{
	int32 characterId = 1;
}


message MapEntitySyncRequest
{
    NEntitySync entitySync = 1;
}


message MapEntitySyncResponse
{
    repeated NEntitySync entitySyncs = 2;
}

message MapTeleportRequest
{
	int32 teleporterId = 1;
}

// Shop Protocol
message ItemBuyRequest
{
	int32 shopId = 1;
	int32 shopItemId = 2;
}

message ItemBuyResponse
{
	Result result = 1;
	string errormsg = 2;
}

message ItemEquipRequest
{
    int32 slot = 1;
    int32 itemId = 2;
    bool isEquip = 3;
}

message ItemEquipReponse
{
    RESULT result = 1;
    string srromsg = 2;
}


////////////////////////////////////////////////////////////////
//
//  QuestSystem
//
////////////////////////////////////////////////////////////////

enum QUEST_STATUS
{
	IN_PROGRESS = 0; // 正在进行中
	COMPLATED = 1; // 已经完成 但是未提交
	FINISHED = 2; // 已经完成 并且已经提交
	FAILED = 3; // 已经失败
}

enum QUEST_LIST_TYPE
{
	ALL = 0;
	IN_PROGRESS = 1;
	FINISHED = 2;
}

message NQuestInfo
{
	int32 quest_id = 1;
	int32 quest_guid = 2;
	QUEST_STATUS status = 3;
	repeated int32 targets = 4;
}

message QuestListRequest
{
	QUEST_LIST_TYPE listType = 1;
}

message QuestListResponse
{
	RESULT result = 1;
	string errormsg = 2;
	repeated NQuestInfo quests = 3;
}

message QuestAcceptRequest
{
	int32 quest_id = 1;
}
message QuestAcceptResponse
{
	RESULT result = 1;
	string errormsg = 2;
	NQuestInfo quest = 3;
}

message QuestSubmitRequest
{
	int32 quest_id = 1;
}

message QuestSubmitResponse
{
	RESULT result = 1;
	string errormsg = 2;
	NQuestInfo quest = 3;
}

message QuestAbandonRequest
{
	int32 quest_id = 1;
}

message QuestAbandonResponse
{
	RESULT result = 1;
	string errormsg = 2;
}

////////////////////////////////////////////////////////////////
//
//  FriendSystem
//
////////////////////////////////////////////////////////////////
message NFriendInfo
{
	int32 id = 1;
	NCharacterInfo friendInfo = 2;
	int32 status = 3;
}

message FriendAddRequest
{
	int32 from_id = 1;
	string from_name = 2;
	int32 to_id = 3;
	string to_name = 4;
}


message FriendAddResponse
{
	RESULT result = 1;
	string errormsg = 2;
	FriendAddRequest request = 3;
}


message FriendListRequest
{

}

message FriendListResponse
{
	RESULT result = 1;
	string errormsg = 2;
	repeated NFriendInfo friends = 3;
}

message FriendRemoveRequest
{
	int32 id = 1;
	int32 friendId = 2;
}

message FriendRemoveResponse
{
	RESULT result = 1;
	string errormsg = 2;
	int32 id = 3;
}

////////////////////////////////////////////////////////////////
//
//  TeamSystem
//
////////////////////////////////////////////////////////////////

message NTeamInfo
{
	int32 id = 1;
	int32 leader = 2;
	repeated NCharacterInfo members = 3;
}

message TeamInviteRequest
{
	int32 team_id = 1;
	int32 from_id = 2;
	string from_name = 3;
	int32 to_id = 4;
	string to_name = 5;
}

message TeamInviteResponse
{
	Result result = 1;
	string errormsg = 2;
	TeamInviteRequest request = 3;
}

message TeamInfoRequest
{

}

message TeamInfoResponse
{
	Result result = 1;
	string errormsg = 2;
	NTeamInfo team = 3;
}

message TeamLeaveRequest
{
	int32 team_id = 1; // 要离开的队伍的Id
	int32 characterId = 2; // 要离开的队伍的队员的Id
}

message TeamLeaveResponse
{
	Result result = 1;
	string errormsg = 2;
	int32 characterId = 3;
}



////////////////////////////////////////////////////////////////
//
//  GuildSystem (公会系统)
//
////////////////////////////////////////////////////////////////

enum GuildPosition {
    GUILD_POSITION_NONE = 0;        // 无职位
    GUILD_POSITION_LEADER = 1;      // 会长
    GUILD_POSITION_VICE_LEADER = 2; // 副会长
    GUILD_POSITION_MEMBER = 3;      // 普通成员
}

enum GuildActivityLevel {
    GUILD_ACTIVITY_LOW = 0;         // 低活跃度
    GUILD_ACTIVITY_NORMAL = 1;      // 正常活跃度
    GUILD_ACTIVITY_HIGH = 2;        // 高活跃度
}

enum GuildApplyProcessCommand {
    APPLY_NONE = 0;                 // 无操作
    ACCEPT = 1;                     // 同意申请
    REJECT = 2;                     // 拒绝申请
}

enum GuildAdminCommand {
    COMMAND_NONE = 0;               // 无操作
    COMMAND_TRANSFER_LEADER = 1;    // 转让会长
    COMMAND_PROMOTE_VICE = 2;       // 任命副会长
    COMMAND_DEMOTE_NORMAL = 3;      // 降职为普通成员
    COMMAND_KICK_MEMBER = 4;        // 逐出公会
}

// 单个入会申请信息
message NGuildApply {
    int32 character_id = 1;         // 申请人角色ID
    string name = 2;                // 申请人名字
    int32 level = 3;                // 申请人等级
    int32 class_type = 4;           // 申请人职业
    int32 is_online = 5;            // 在线状态
}

// 单个公会成员信息
message NGuildMember {
    int32 character_id = 1;         // 成员角色ID
    string name = 2;                // 成员名字
    int32 level = 3;                // 成员等级
    int32 class_type = 4;           // 成员职业
    GuildPosition position = 5;     // 成员职位
    int32 is_online = 6;            // 在线状态
}

// 公会基础信息 (大盘数据)
message NGuildInfo {
    int32 id = 1;                   // 公会唯一ID
    string name = 2;                // 公会名字
    string leader_name = 3;         // 会长名字
    int32 level = 4;                // 公会等级
    int32 member_count = 5;         // 成员人数
    GuildActivityLevel activity_level = 6; // 活跃度
    int32 req_level = 7;            // 入会最低等级要求
    string notice = 8;              // 公会宗旨
}



// 发起创建公会
message GuildCreateRequest {
    string guild_name = 1;          // 拟创建的公会名
    string notice = 2;              // 拟设定的宗旨
	int32 req_level = 3;            // 拟设定的最低等级限制
}
// 响应创建公会结果
message GuildCreateResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
    NGuildInfo guild = 3;           // 新公会的大盘数据
}

// 发起解散公会
message GuildDisbandRequest {}
// 响应解散公会结果
message GuildDisbandResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
}

// 发起修改公会设置
message GuildSettingModifyRequest {
    string new_notice = 1;          // 新宗旨
    int32 new_req_level = 2;        // 新等级限制
}
// 响应修改公会设置结果
message GuildSettingModifyResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
}

// 发起申请入会
message GuildJoinApplyRequest {
    int32 target_guild_id = 1;      // 想要加入的公会ID
}
// 响应申请入会结果
message GuildJoinApplyResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
}

// 发起审批操作
message GuildApplyProcessRequest {
    GuildApplyProcessCommand command = 1; // 同意或拒绝指令
    int32 applicant_character_id = 2;     // 被审批的玩家ID
}
// 响应审批操作结果
message GuildApplyProcessResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
}

// 发起退出公会
message GuildLeaveRequest {}
// 响应退出公会结果
message GuildLeaveResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
}

// 发起公会聊天
message GuildChatRequest {
    string chat_content = 1;        // 聊天文本内容
}

// 发起成员管理操作
message GuildAdminRequest {
    GuildAdminCommand command = 1;  // 具体管理指令
    int32 target_character_id = 2;  // 被操作的目标玩家ID
}
// 响应成员管理操作结果
message GuildAdminResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
}

// -----------------------------------------------------------
// 客户端按需拉取数据 (Pull Only)
// -----------------------------------------------------------

// 拉取公会成员列表
message GuildMemberListRequest {}
// 响应公会成员列表数据
message GuildMemberListResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
    repeated NGuildMember members = 3; // 全量成员列表数据
}

// 拉取入会申请列表
message GuildApplyListRequest {}
// 响应入会申请列表数据
message GuildApplyListResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
    repeated NGuildApply applies = 3;  // 全量申请列表数据
}

// 拉取全服公会大厅列表
message GuildListRequest {}
// 响应全服公会大厅列表数据
message GuildListResponse {
    RESULT result = 1;              // 处理结果
    string errormsg = 2;            // 失败原因
    repeated NGuildInfo guilds = 3; // 全量公会摘要列表数据
}



// 通知：成员增加
message GuildMemberAddNotify {
    NGuildMember new_member = 1;    // 新增成员的实体数据
}

// 通知：成员移除
message GuildMemberRemoveNotify {
    int32 character_id = 1;         // 被移除成员的角色ID
}

// 通知：申请增加
message GuildApplyAddNotify {
    NGuildApply new_apply = 1;      // 新增申请的实体数据
}

// 通知：申请移除
message GuildApplyRemoveNotify {
    int32 character_id = 1;         // 被移除申请的角色ID
}

// 通知：入会申请的结果反馈
message GuildApplyResultNotify {
    int32 guild_id = 1;             // 申请的目标公会ID
    string guild_name = 2;          // 目标公会名称
    bool is_accept = 3;             // 是否被同意入会
}

// 通知：公会基础信息变化
message GuildInfoChangeNotify {
    NGuildInfo guild_info = 1;      // 更新后的全量公会基础数据
}

// 通知：接收公会聊天信息
message GuildChatNotify {
    int32 sender_id = 1;            // 发言者角色ID
    string sender_name = 2;         // 发言者名字
    string chat_content = 3;        // 聊天内容
}

////////////////////////////////////////////////////////////////
//
//  ChatSystem
//
////////////////////////////////////////////////////////////////

enum ChatChannel
{
	ALL = -1;
	LOCAL = 1;
	WORLD = 2;
	SYSTEM = 4;
	PRIVATE = 8;
	TEAM = 16;
	GUILD = 32;
}

message NChatMessage
{
	ChatChannel channel = 1;
	int32 fromId = 2;        // 发送者ID
    string fromName = 3;     // 发送者名字
    int32 fromClass = 4;     // 发送者职业 (用于前端UI按职业渲染颜色)
    int32 toId = 5;          // 接收者ID (私聊专用)
    string toName = 6;       // 接收者名字 (私聊专用)
    string message = 7;      // 消息内容
    int64 time = 8;          // 发送时间戳
}

message ChatRequest
{
    NChatMessage message = 1; 
}

message ChatResponse
{
    RESULT result = 1;
    string errormsg = 2;
}

message ChatNotify
{
    NChatMessage message = 1;
}